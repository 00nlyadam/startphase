<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StartPhase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="startphase-logo.png" alt="StartPhase">
      </div>

      <nav class="nav">
        <a href="https://www.youtube.com/" target="_blank" rel="noopener">Youtube</a>
        <a href="https://discord.com/app" target="_blank" rel="noopener">Discord</a>
        <a href="https://www.google.com/" target="_blank" rel="noopener">Google</a>
        <a href="https://duckduckgo.com/" target="_blank" rel="noopener">DDG</a>
        <a href="https://www.roblox.com/" target="_blank" rel="noopener">Roblox</a>
      </nav>
    </aside>

    <section class="content">
      <img class="hero-logo" src="startphase-logo.png" alt="StartPhase">

      <form class="search" id="searchForm">
        <input
          id="searchInput"
          type="search"
          placeholder="Search the web..."
          aria-label="Search the web"
          autocomplete="off"
        >
      </form>

      <div class="powered">Powered by DuckDuckGo.</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
